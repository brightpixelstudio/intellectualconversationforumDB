<div class="navbar">
  <ul class="nav-links">
    @for (item of menuItems; track item.label) {
      <li>
        <a
          [routerLink]="item.link"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</div>
